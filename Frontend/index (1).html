<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falcon X | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-box">
        <h1>Welcome to Falcon X</h1>
        <p class="login-subtitle">Please login to continue</p>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()" class="cta-btn login-btn">
            Login
        </button>

        <p class="login-hint">Demo Login: <b>admin / admin</b></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
