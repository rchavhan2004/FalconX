<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falcon X | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand">Falcon X</div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Logout</a>
        </div>
    </nav>

    <!-- HEADER -->
    <div class="dashboard-header">
        <h1>Configure Your Audit</h1>
        <p>Set up your security audit parameters.</p>
    </div>

    <!-- CONTENT -->
    <div class="dashboard-container">

        <!-- SECTION 1 -->
        <div class="dash-card">
            <h3>1. Select Audit Type</h3>
            <div class="radio-group">
                <label><input type="radio" name="audit"> Compliance Audit</label>
                <label><input type="radio" name="audit"> Vulnerability Scan</label>
                <label><input type="radio" name="audit" checked> Combined Audit</label>
            </div>
        </div>

        <!-- SECTION 2 -->
        <div class="dash-card">
            <h3>2. Select Target Resources</h3>

            <div class="two-col">

                <!-- CLOUD -->
                <div>
                    <h4>Cloud Target</h4>

                    <label>AWS Account</label>
                    <select>
                        <option>Select Account</option>
                        <option>Account 1</option>
                        <option>Account 2</option>
                    </select>

                    <div class="checkbox-group">
                        <label><input type="checkbox" checked> IAM</label>
                        <label><input type="checkbox" checked> S3 Buckets</label>
                        <label><input type="checkbox" checked> EC2 Instances</label>
                    </div>
                </div>

                <!-- APPLICATION -->
                <div>
                    <h4>Application Target</h4>

                    <label>Target URL / IP</label>
                    <input type="text" placeholder="Enter URL or IP Address">

                    <label>Ports</label>
                    <input type="text" placeholder="e.g. 80, 443">
                </div>

            </div>
        </div>

        <!-- SECTION 3 -->
        <div class="dash-card">
            <h3>3. Scan Settings</h3>

            <div class="radio-group">
                <label><input type="radio" name="scan" checked> Manual Scan</label>
                <label><input type="radio" name="scan"> Scheduled Scan</label>
            </div>

            <label>Scan Depth</label>
            <select>
                <option>Full Scan</option>
                <option>Quick Scan</option>
            </select>
        </div>

        <!-- BUTTON -->
        <div class="center-btn">
            <button class="cta-btn">Start Audit</button>
        </div>

    </div>

</body>
</html>
